<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osu!</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Exo 2',sans-serif;cursor:none!important;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:url('https://picsum.photos/seed/osu-play-2024/1920/1080.jpg') center/cover;filter:blur(4px) brightness(0.22) saturate(0.6)}
canvas#game{position:fixed;inset:0;z-index:10}
#cur{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);will-change:left,top}
#cur-ring{width:54px;height:54px;border:2.5px solid rgba(255,102,170,0.85);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform 0.04s ease-out}
#cur-ring.click{transform:translate(-50%,-50%) scale(0.82)}
#cur-dot{width:5px;height:5px;background:#fff;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1}
#hp-wrap{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.06);z-index:100}
#hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#e83050,#ff66ab,#44dd66);transform-origin:left;transition:transform 0.12s}
#hud{position:fixed;top:14px;left:28px;right:28px;z-index:100;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
.h-score{font-size:2.2rem;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.h-acc{font-size:0.95rem;font-weight:600;color:rgba(255,255,255,0.45);margin-top:2px}
.h-combo{text-align:right}
.h-cb{font-size:2.8rem;font-weight:900;color:#fff;display:inline-block;transition:transform 0.07s;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.h-cb.bump{transform:scale(1.25)}
.h-cx{font-size:1.1rem;font-weight:700;color:rgba(255,255,255,0.4);margin-left:2px}
#keys{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:100;pointer-events:none}
.kk{width:50px;height:50px;border-radius:10px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:rgba(255,255,255,0.18);text-transform:uppercase;transition:all 0.04s}
.kk.on{background:rgba(255,102,170,0.25);border-color:rgba(255,102,170,0.5);color:#fff;box-shadow:0 0 20px rgba(255,102,170,0.15)}
#welcome{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s ease}
#welcome.gone{opacity:0;pointer-events:none}
.w-logo{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ff66ab,#e83f8c);margin-bottom:28px;position:relative;box-shadow:0 0 60px rgba(255,102,170,0.3);animation:wg 3s ease-in-out infinite}
.w-logo::after{content:'';width:40px;height:40px;border-radius:50%;border:4px solid #fff;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.w-logo::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1}
@keyframes wg{0%,100%{box-shadow:0 0 60px rgba(255,102,170,0.3)}50%{box-shadow:0 0 100px rgba(255,102,171,0.5)}}
#welcome h1{font-size:3rem;font-weight:900;color:#fff;letter-spacing:-1.5px}
.wsub{color:rgba(255,255,255,0.3);font-weight:300;margin:6px 0 38px;font-size:1rem}
.wbtn{padding:15px 56px;border-radius:50px;border:none;background:linear-gradient(135deg,#ff66ab,#e83f8c);color:#fff;font-family:'Exo 2',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.3px;box-shadow:0 4px 30px rgba(255,102,171,0.35);transition:box-shadow .2s,transform .15s;cursor:none!important}
.wbtn:hover{box-shadow:0 6px 40px rgba(255,102,171,0.55);transform:translateY(-2px)}
.whint{margin-top:18px;font-size:.72rem;color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="game"></canvas>
<div id="hp-wrap"><div id="hp-fill"></div></div>
<div id="hud">
    <div><div class="h-score" id="sc">00000000</div><div class="h-acc" id="ac">100.00%</div></div>
    <div class="h-combo"><span class="h-cb" id="cb">0</span><span class="h-cx">x</span></div>
</div>
<div id="keys"><div class="kk" id="kz">Z</div><div class="kk" id="kx">X</div></div>
<div id="welcome">
    <div class="w-logo"></div>
    <h1>osu!</h1>
    <p class="wsub">Click the circles to the rhythm</p>
    <button class="wbtn" id="play-btn">Play</button>
    <div class="whint">Z / X keys or mouse click to hit</div>
</div>
<div id="cur"><div id="cur-ring"></div><div id="cur-dot"></div></div>

<script>
(()=>{
const C=document.getElementById('game'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

const curEl=document.getElementById('cur'),curRing=document.getElementById('cur-ring');
const scEl=document.getElementById('sc'),acEl=document.getElementById('ac'),cbEl=document.getElementById('cb');
const hpFill=document.getElementById('hp-fill'),welEl=document.getElementById('welcome');
const kzEl=document.getElementById('kz'),kxEl=document.getElementById('kx');

/* ── Constants ── */
const AR=1400,CR=27,TR=27,TL=12,PAD_T=110,PAD=80,PAD_B=100;
const W300=80,W100=140,W50=200,MISS_GRACE=250;
const COLORS=['#ff66ab','#66ccff','#66ff66','#ffaa00','#ff4444','#aa88ff'];

/* ── State ── */
let mx=W/2,my=H/2,sx=mx,sy=my;
let playing=false,startT=0;
let score=0,combo=0,hp=1;
let n300=0,n100=0,n50=0,nmiss=0;
let ci=0,cnum=1,nextSp=0,lastC=null;
let mDown=false,zD=false,xD=false;

const trail=[],circles=[],bursts=[],judgs=[],flashes=[];

function now(){return performance.now()-startT}
function d2(x1,y1,x2,y2){return(x1-x2)**2+(y1-y2)**2}
function h2r(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

/* ── Audio ── */
let ac;
function initA(){ac=new(window.AudioContext||window.webkitAudioContext)()}
function sndHit(tp){
    if(!ac)return;const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=tp===300?1050:tp===100?850:650;o.type='sine';
    g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    o.start(t);o.stop(t+0.04);
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.connect(g2);g2.connect(ac.destination);
    o2.frequency.value=2200;o2.type='triangle';
    g2.gain.setValueAtTime(0.06,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.02);
    o2.start(t);o2.stop(t+0.02);
}
function sndMiss(){
    if(!ac)return;const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=180;o.type='sawtooth';
    g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.start(t);o.stop(t+0.12);
}

/* ── Input ── */
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});

function tryHit(){
    if(!playing)return;
    curRing.classList.add('click');
    setTimeout(()=>curRing.classList.remove('click'),45);
    bursts.push({x:sx,y:sy,t:0,d:0.25});

    let best=null,bestD=1e9,bestT=1e9;
    for(const c of circles){
        if(c.hit||c.miss)continue;
        const dd=d2(sx,sy,c.x,c.y);
        if(dd<=CR*CR){
            const td=Math.abs(now()-c.ht);
            if(td<bestT||(td===bestT&&dd<bestD)){best=c;bestD=dd;bestT=td}
        }
    }
    if(best){
        const diff=Math.abs(now()-best.ht);
        let tp=diff<=W300?300:diff<=W100?100:50;
        best.hit=true;best.tp=tp;best.ha=now();
        combo++;
        const mult=1+Math.floor(combo/10)*0.1;
        score+=Math.floor(tp*mult);
        if(tp===300)n300++;else if(tp===100)n100++;else n50++;
        hp=Math.min(1,hp+(tp===300?0.018:tp===100?0.008:0.003));
        sndHit(tp);
        flashes.push({x:best.x,y:best.y,col:best.col,t:0,d:0.1});
        judgs.push({x:best.x,y:best.y-CR-22,txt:String(tp),col:tp===300?'#66ccff':tp===100?'#66ff66':'#ffaa00',t:0,d:0.55});
        updHUD();
    }
}

addEventListener('mousedown',e=>{if(e.button<=2){if(!mDown)tryHit();mDown=true}});
addEventListener('mouseup',()=>{mDown=false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
    if(e.repeat)return;
    if((e.key==='z'||e.key==='Z')&&!zD){tryHit();zD=true;kzEl.classList.add('on')}
    if((e.key==='x'||e.key==='X')&&!xD){tryHit();xD=true;kxEl.classList.add('on')}
});
addEventListener('keyup',e=>{
    if(e.key==='z'||e.key==='Z'){zD=false;kzEl.classList.remove('on')}
    if(e.key==='x'||e.key==='X'){xD=false;kxEl.classList.remove('on')}
});

/* ── Spawn ── */
function spawn(){
    let x,y,att=0;
    do{
        x=PAD+Math.random()*(W-PAD*2);
        y=PAD_T+Math.random()*(H-PAD_T-PAD_B);
        att++;
    }while(lastC&&d2(x,y,lastC.x,lastC.y)<110*110&&att<30);
    const ht=now()+AR;
    circles.push({x,y,ht,col:COLORS[ci],num:cnum++,hit:false,miss:false,tp:0,ha:0,mt:0});
    lastC={x,y};
    if(cnum%6===1&&cnum>1)ci=(ci+1)%COLORS.length;
    nextSp=now()+550+Math.random()*500;
}

/* ── HUD ── */
function updHUD(){
    scEl.textContent=String(score).padStart(8,'0');
    cbEl.textContent=combo;
    cbEl.classList.add('bump');setTimeout(()=>cbEl.classList.remove('bump'),70);
    const tot=n300+n100+n50+nmiss;
    const acc=tot===0?100:((n300*300+n100*100+n50*50)/(tot*300)*100);
    acEl.textContent=acc.toFixed(2)+'%';
    hpFill.style.transform=`scaleX(${hp})`;
}

/* ── Update ── */
function update(dt){
    sx+=(mx-sx)*0.7;sy+=(my-sy)*0.7;
    trail.unshift({x:sx,y:sy});
    if(trail.length>TL)trail.pop();
    if(!playing)return;

    if(now()>=nextSp)spawn();

    for(const c of circles){
        if(!c.hit&&!c.miss&&now()>c.ht+MISS_GRACE){
            c.miss=true;c.mt=now();
            combo=0;nmiss++;hp=Math.max(0,hp-0.06);
            cnum=1;ci=(ci+1)%COLORS.length;
            sndMiss();
            judgs.push({x:c.x,y:c.y-CR-22,txt:'Miss',col:'#ff4444',t:0,d:0.55});
            updHUD();
        }
    }
    for(let i=circles.length-1;i>=0;i--){
        const c=circles[i];
        if(c.hit&&now()-c.ha>0.35)circles.splice(i,1);
        if(c.miss&&now()-c.mt>0.35)circles.splice(i,1);
    }
    for(let i=bursts.length-1;i>=0;i--){bursts[i].t+=dt;if(bursts[i].t>=bursts[i].d)bursts.splice(i,1)}
    for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=dt;if(flashes[i].t>=flashes[i].d)flashes.splice(i,1)}
    for(let i=judgs.length-1;i>=0;i--){judgs[i].t+=dt;if(judgs[i].t>=judgs[i].d)judgs.splice(i,1)}
}

/* ── Render ── */
function drawCirc(x,y,r,col,num,alpha){
    const g=X.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,h2r(col,0.5*alpha));
    g.addColorStop(1,h2r(col,0.18*alpha));
    X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fillStyle=g;X.fill();
    X.beginPath();X.arc(x,y,r,0,Math.PI*2);
    X.strokeStyle=`rgba(255,255,255,${0.9*alpha})`;X.lineWidth=3;X.stroke();
    X.font='bold 18px "Exo 2"';X.textAlign='center';X.textBaseline='middle';
    X.strokeStyle=`rgba(0,0,0,${0.65*alpha})`;X.lineWidth=3.5;
    X.strokeText(String(num),x,y+1);
    X.fillStyle=`rgba(255,255,255,${alpha})`;X.fillText(String(num),x,y+1);
}

function render(){
    X.clearRect(0,0,W,H);

    /* Vignette */
    const vg=X.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.78);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
    X.fillStyle=vg;X.fillRect(0,0,W,H);

    if(!playing)return;
    const n=now();

    /* Hit circles */
    for(const c of circles){
        if(c.hit){
            const t=(n-c.ha)/0.3;
            if(t<1){
                const r=CR*(1+t*0.6),a=1-t;
                X.beginPath();X.arc(c.x,c.y,r,0,Math.PI*2);
                X.strokeStyle=`rgba(255,255,255,${a*0.5})`;X.lineWidth=2.5;X.stroke();
                X.beginPath();X.arc(c.x,c.y,r,0,Math.PI*2);
                X.fillStyle=h2r(c.col,a*0.25);X.fill();
            }
            continue;
        }
        if(c.miss){
            const t=(n-c.mt)/0.3;
            if(t<1){X.save();X.globalAlpha=1-t;drawCirc(c.x,c.y,CR,c.col,c.num,1);X.restore()}
            continue;
        }

        /* Approach circle */
        const prog=(n-(c.ht-AR))/AR;
        const aR=CR*(3-2*Math.min(prog,1));
        const aA=prog>1?Math.max(0,1-(prog-1)*4):0.75;
        if(aA>0.01){
            X.beginPath();X.arc(c.x,c.y,aR,0,Math.PI*2);
            X.strokeStyle=h2r(c.col,aA);X.lineWidth=2.5;X.stroke();
        }

        /* Main circle */
        const cAlpha=prog>1?Math.max(0,1-(prog-1)*3):1;
        if(cAlpha>0.01)drawCirc(c.x,c.y,CR,c.col,c.num,cAlpha);
    }

    /* Flashes */
    for(const f of flashes){
        const t=f.t/f.d,r=CR*(1+t*0.8),a=1-t;
        X.beginPath();X.arc(f.x,f.y,r,0,Math.PI*2);
        X.fillStyle=`rgba(255,255,255,${a*0.35})`;X.fill();
    }

    /* Cursor trail */
    for(let i=1;i<trail.length;i++){
        const a=(1-i/trail.length)*0.22;
        X.beginPath();X.arc(trail[i].x,trail[i].y,TR,0,Math.PI*2);
        X.strokeStyle=`rgba(255,102,170,${a})`;X.lineWidth=2;X.stroke();
    }

    /* Click bursts */
    for(const b of bursts){
        const t=b.t/b.d,r=TR+TR*1.8*t,a=1-t;
        X.beginPath();X.arc(b.x,b.y,r,0,Math.PI*2);
        X.strokeStyle=`rgba(255,102,170,${a*0.65})`;X.lineWidth=2;X.stroke();
    }

    /* Judgments */
    for(const j of judgs){
        const t=j.t/j.d,yo=-t*55;
        const sc=t<0.08?1+(1-t/0.08)*0.35:1;
        const a=t<0.4?1:Math.max(0,1-(t-0.4)/0.6);
        X.save();X.translate(j.x,j.y+yo);X.scale(sc,sc);
        X.font='bold 24px "Exo 2"';X.textAlign='center';X.textBaseline='middle';
        X.strokeStyle='rgba(0,0,0,0.55)';X.lineWidth=4.5;X.strokeText(j.txt,0,0);
        X.globalAlpha=a;X.fillStyle=j.col;X.fillText(j.txt,0,0);
        X.restore();
    }
}

/* ── Loop ── */
let lt=0;
function loop(t){
    const dt=Math.min((t-lt)/1000,0.05);lt=t;
    update(dt);render();
    curEl.style.left=sx+'px';curEl.style.top=sy+'px';
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── Start ── */
document.getElementById('play-btn').addEventListener('click',()=>{
    initA();if(ac.state==='suspended')ac.resume();
    playing=true;startT=performance.now();nextSp=200;
    welEl.classList.add('gone');
});
})();
</script>
</body>
</html>
